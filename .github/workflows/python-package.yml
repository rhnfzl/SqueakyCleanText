name: Python package

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Check uv.lock and pylock.toml match pyproject.toml
      run: |
        pip install uv==0.10.9
        uv lock --check
        uv export --format pylock.toml --all-extras --output-file pylock.toml --locked > /dev/null
        git diff --exit-code pylock.toml

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check initial disk usage
      run: df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]" --no-cache-dir

    - name: Clean up pip cache
      run: pip cache purge

    - name: Check disk usage after install
      run: df -h

    - name: Lint with ruff
      run: |
        ruff check sct/ tests/ scripts/

    # tests/test_sct.py skips its real-NER tests when this load fails, so fail here instead.
    - name: Check the test NER model loads
      run: |
        python -c "
        from sct.config import TextCleanerConfig
        from sct.utils.ner import GeneralNER
        from tests.conftest import TEST_NER_MODELS
        ner = GeneralNER(TextCleanerConfig(ner_device='cpu', ner_models=TEST_NER_MODELS))
        ner.ner_process('Test sentence.', positional_tags=['PER', 'ORG', 'LOC'], ner_confidence_threshold=0.85)
        assert 'ENGLISH' in ner._pipelines
        "

    - name: Test with pytest and coverage
      run: |
        pytest tests/ --cov=sct --cov-report=xml --cov-fail-under=85 -v -rs

  # Required gate for the adapters (decision 13): real worker processes on Linux.
  # Mark it required in GitHub branch protection; YAML cannot.
  linux-workers:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            start: fork
          - python-version: "3.14"
            start: forkserver  # 3.14's Linux default

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache the test NER model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-protectai-bert-base-NER-onnx-${{ runner.os }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,datasets,datatrove,langchain,haystack]" --no-cache-dir

    - name: Test worker processes and adapters
      env:
        SCT_MP_START: ${{ matrix.start }}
      run: |
        pytest tests/test_linux_workers.py tests/test_integrations_*.py -v -rs --cov=sct/integrations --cov-config=.coveragerc-integrations --cov-fail-under=85
