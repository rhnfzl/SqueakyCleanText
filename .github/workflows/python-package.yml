name: Python package

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop", "improvements/**" ]

permissions:
  contents: read

# Main and develop runs still validate merged code and seed default-branch caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Python static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.9"
        enable-cache: false

    - name: Check uv.lock and pylock.toml match pyproject.toml
      run: |
        uv lock --check
        uv export --format pylock.toml --all-extras --output-file pylock.toml --locked > /dev/null
        git diff --exit-code pylock.toml

    - name: Install locked lint dependencies
      run: uv sync --locked --extra dev

    - name: Lint with Ruff
      run: .venv/bin/ruff check sct/ tests/ scripts/

    - name: Type-check sct with mypy
      run: uvx mypy==2.4.1 --python-executable .venv/bin/python

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.9"
        cache-dependency-glob: uv.lock
        cache-suffix: core-tests
        # Keep downloaded wheels, including the large Lingua wheel.
        prune-cache: false

    - name: Restore the pinned test NER model
      id: test-model
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/huggingface/hub/models--protectai--bert-base-NER-onnx
        key: test-ner-model-v1-${{ runner.os }}-${{ hashFiles('tests/conftest.py') }}

    - name: Install locked test dependencies
      run: uv sync --locked --extra dev --extra test

    # tests/test_sct.py skips its real-NER tests when this load fails, so fail here instead.
    - name: Check the test NER model loads
      run: |
        .venv/bin/python -c "
        from sct.config import TextCleanerConfig
        from sct.utils.ner import GeneralNER
        from tests.conftest import TEST_NER_MODELS, TEST_NER_REVISIONS
        ner = GeneralNER(TextCleanerConfig(ner_device='cpu', ner_models=TEST_NER_MODELS, ner_model_revisions=TEST_NER_REVISIONS))
        ner.ner_process('Test sentence.', positional_tags=['PER', 'ORG', 'LOC'], ner_confidence_threshold=0.85)
        assert 'ENGLISH' in ner._pipelines
        "

    - name: Save the pinned test NER model
      if: matrix.python-version == '3.12' && steps.test-model.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/huggingface/hub/models--protectai--bert-base-NER-onnx
        key: ${{ steps.test-model.outputs.cache-primary-key }}

    - name: Test with pytest and coverage
      env:
        # Python 3.14 already defaults to this line coverage engine.
        COVERAGE_CORE: sysmon
      run: |
        .venv/bin/pytest tests/ --cov=sct --cov-report=xml --cov-fail-under=85 -v -rs --durations=20

  # Required gate for the adapters (decision 13): real worker processes on Linux.
  # Mark it required in GitHub branch protection; YAML cannot.
  linux-workers:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            start: fork
          - python-version: "3.14"
            start: forkserver  # 3.14's Linux default

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.9"
        cache-dependency-glob: uv.lock

    - name: Restore the pinned test NER model
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/huggingface/hub/models--protectai--bert-base-NER-onnx
        key: test-ner-model-v1-${{ runner.os }}-${{ hashFiles('tests/conftest.py') }}

    - name: Install locked adapter dependencies
      run: uv sync --locked --extra dev --extra test --extra datasets --extra corpus --extra langchain --extra haystack

    - name: Test worker processes and adapters
      env:
        SCT_MP_START: ${{ matrix.start }}
      run: |
        .venv/bin/pytest tests/test_linux_workers.py tests/test_integrations_*.py -v -rs --cov=sct/integrations --cov-config=.coveragerc-integrations --cov-fail-under=85 --durations=10
