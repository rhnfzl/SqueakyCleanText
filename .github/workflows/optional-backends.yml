name: Optional backend tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: torch
            extras: torch
            filter: TestTorchBackend
          - name: gliner
            extras: gliner
            filter: TestGLiNERBackend or TestPIIMode or TestEnsembleBackends
          - name: classify
            extras: classify
            filter: TestDocumentClassification
          - name: presidio-gliner
            extras: presidio,gliner
            filter: TestPresidioGLiNER

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,$EXTRAS]"

      - name: Run backend tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: pytest tests/test_functional.py -v -k "$TEST_FILTER"
