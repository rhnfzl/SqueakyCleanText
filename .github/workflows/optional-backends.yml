name: Optional backend tests

on:
  workflow_dispatch:
    inputs:
      pinned_model_baseline:
        type: boolean
        default: false
  pull_request:
    paths:
      - sct/utils/gliner_adapter.py
      - sct/utils/gliclass_adapter.py
      - sct/utils/torch_pipeline.py
      - sct/utils/ner.py
      - sct/adapters/**
      - sct/integrations/**
      - sct/detectors*.py
      - sct/findings.py
      - sct/coordinates.py
      - sct/documents.py
      - sct/config.py
      - sct/sct.py
      - sct/unified.py
      - sct/routing.py
      - sct/field*.py
      - tests/test_*document*.py
      - tests/test_docling_integration.py
      - tests/fixtures/documents/**
      - tests/test_*datafog*.py
      - tests/test_*secret*.py
      - tests/test_baseline_measurement.py
      - tests/test_improvements_end_to_end.py
      - tests/test_quality_export.py
      - scripts/export_quality_head.py
      - sct/corpus/**
      - tests/test_corpus*.py
      - sct/token_stores/**
      - tests/test_sqlite_token_store.py
      - tests/test_token_store_operations.py
      - tests/test_optional_profiles.py
      - evaluation/improvements/**
      - tests/test_processing_compatibility.py
      - tests/fixtures/processing_compatibility*.json
      - uv.lock
      - pyproject.toml
      - .github/workflows/optional-backends.yml
      - .coveragerc-documents
      - .coveragerc-integrations
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: torch
            extras: torch
            filter: TestTorchBackend
          - name: gliner
            extras: gliner
            filter: TestGLiNERBackend or TestPIIMode or TestEnsembleBackends
          - name: classify
            extras: classify
            filter: TestDocumentClassification
          - name: presidio-gliner
            extras: presidio
            filter: TestPresidioGLiNER

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,$EXTRAS]"

      - name: Install Presidio English model
        if: matrix.name == 'presidio-gliner'
        run: python -m spacy download en_core_web_lg

      - name: Run backend tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: pytest tests/test_functional.py -v -rs -k "$TEST_FILTER"

  provider-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        profile: [secrets, documents, token-store, corpus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - name: Install locked provider profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: uv sync --locked --extra dev --extra test --extra "$PROFILE"
      - name: Exercise installed provider
        env:
          SCT_OPTIONAL_PROFILE: ${{ matrix.profile }}
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_optional_profiles.py tests/test_processing_compatibility.py tests/test_baseline_measurement.py -v -s

      - name: Exercise native credential detector
        if: matrix.profile == 'secrets'
        env:
          SCT_OPTIONAL_PROFILE: secrets
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_secret_detector.py -v

      - name: Prepare explicit pinned PDF artifacts
        if: matrix.profile == 'documents'
        run: |
          .venv/bin/python -c 'from pathlib import Path; from sct.integrations.docling import prepare_docling_artifacts; prepare_docling_artifacts(Path(".docling-artifacts"), allow_download=True)'

      - name: Exercise native offline PDF layout, OCR and tables
        if: matrix.profile == 'documents'
        env:
          SCT_OPTIONAL_PROFILE: documents
          SCT_DOCLING_ARTIFACTS: .docling-artifacts
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          .venv/bin/python -m pytest tests/test_docling_integration.py -v -s
          --cov=sct/integrations --cov-config=.coveragerc-documents --cov-fail-under=85

      - name: Exercise encrypted token-store operations
        if: matrix.profile == 'token-store'
        env:
          SCT_OPTIONAL_PROFILE: token-store
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_sqlite_token_store.py tests/test_token_store_operations.py -v

      - name: Exercise complete native corpus workflow
        if: matrix.profile == 'corpus'
        env:
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_corpus_*.py -v

  combined-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test --extra corpus --extra token-store
      - name: Exercise combined privacy and replay contracts
        env:
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: .venv/bin/python -m pytest tests/test_improvements_end_to_end.py -v

  quality-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test --extra torch --extra quantize
      - name: Prepare pinned trained quality artifacts
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from huggingface_hub import snapshot_download
          models = {
              "quality_head": ("epfml/FineWeb2-HQ-Plus-Classifier", "bf13b1ac9448e874d0eb545891a58524d3f9afd1"),
              "quality_backbone": ("FacebookAI/xlm-roberta-base", "e73636d4f797dec63c3081bb6ed5c7b0bb3f2089"),
          }
          artifacts = {}
          for key, (repo, revision) in models.items():
              snapshot = Path(snapshot_download(repo, revision=revision,
                  allow_patterns=["*.json", "*.safetensors", "model.pt", "sentencepiece.bpe.model"]))
              files = {}
              for path in snapshot.rglob("*"):
                  if path.is_file():
                      with path.open("rb") as stream:
                          files[str(path.relative_to(snapshot))] = hashlib.file_digest(stream, "sha256").hexdigest()
              artifacts[key] = {"repo": repo, "revision": revision, "snapshot": str(snapshot), "files": files}
          Path("quality-artifacts.json").write_text(json.dumps(artifacts))
          PY
      - name: Exercise trained offline export and Torch ONNX parity
        env:
          SCT_QUALITY_EXPORT_ARTIFACTS: quality-artifacts.json
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: .venv/bin/python -m pytest tests/test_quality_export.py -v -s

  pinned-model-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.pinned_model_baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test
      - run: .venv/bin/python -m pytest tests/test_batching.py tests/test_processing_compatibility.py -v
      - run: PYTHONPATH=. .venv/bin/python evaluation/improvements/measure_baseline.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-model-baseline
          path: baseline-measured.json
