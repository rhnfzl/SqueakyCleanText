name: Optional backend tests

on:
  workflow_dispatch:
    inputs:
      pinned_model_baseline:
        type: boolean
        default: false
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed paths
        id: diff
        shell: bash
        run: |
          # Compare the tested PR merge commit with its base parent.
          paths="$RUNNER_TEMP/optional-backend-paths"
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$paths"
          docs_only=true
          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|CHANGELOG.md|AGENTS.md|llms.txt|docs/*.md) ;;
              *) docs_only=false; break ;;
            esac
          done < "$paths"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: |
      !cancelled() && (github.event_name != 'pull_request' ||
        (needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: torch
            extras: torch
            filter: TestTorchBackend
          - name: gliner
            extras: gliner
            filter: TestGLiNERBackend or TestPIIMode or TestEnsembleBackends
          - name: classify
            extras: classify
            filter: TestDocumentClassification
          - name: presidio-gliner
            extras: presidio
            filter: TestPresidioGLiNER

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          # Linux Torch wheels make the shared pip cache larger than 3 GB.
          enable-cache: false

      - name: Install locked backend
        env:
          EXTRAS: ${{ matrix.extras }}
        run: uv sync --locked --extra dev --extra test --extra "$EXTRAS"

      - name: Install Presidio English model
        if: matrix.name == 'presidio-gliner'
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: |
          .venv/bin/python -m spacy download en_core_web_lg
          .venv/bin/python -c 'import en_core_web_lg'

      - name: Run backend tests
        env:
          TEST_FILTER: ${{ matrix.filter }}
        run: .venv/bin/pytest tests/test_functional.py -v -rs -k "$TEST_FILTER"

  chunking-providers:
    needs: changes
    if: |
      !cancelled() && (github.event_name != 'pull_request' ||
        (needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test --extra chunking
      - run: .venv/bin/pytest tests/test_chunking_router.py -v -rs

  provider-profile:
    needs: changes
    if: |
      !cancelled() && (github.event_name != 'pull_request' ||
        (needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        profile: [secrets, documents, token-store, corpus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - name: Install locked provider profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: uv sync --locked --extra dev --extra test --extra "$PROFILE"
      - name: Exercise installed provider
        env:
          SCT_OPTIONAL_PROFILE: ${{ matrix.profile }}
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_optional_profiles.py tests/test_processing_compatibility.py tests/test_baseline_measurement.py -v -s

      - name: Exercise native credential detector
        if: matrix.profile == 'secrets'
        env:
          SCT_OPTIONAL_PROFILE: secrets
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_secret_detector.py -v

      - name: Prepare explicit pinned PDF artifacts
        if: matrix.profile == 'documents'
        run: |
          .venv/bin/python -c 'from pathlib import Path; from sct.integrations.docling import prepare_docling_artifacts; prepare_docling_artifacts(Path(".docling-artifacts"), allow_download=True)'

      - name: Exercise native offline PDF layout, OCR and tables
        if: matrix.profile == 'documents'
        env:
          SCT_OPTIONAL_PROFILE: documents
          SCT_DOCLING_ARTIFACTS: .docling-artifacts
          HF_HUB_OFFLINE: "1"
          ORT_DISABLE_TELEMETRY: "1"
          OMP_NUM_THREADS: "2"
        run: >-
          .venv/bin/python -m pytest tests/test_docling_integration.py -v -s
          --cov=sct/integrations --cov-config=.coveragerc-documents --cov-fail-under=85

      - name: Exercise encrypted token-store operations
        if: matrix.profile == 'token-store'
        env:
          SCT_OPTIONAL_PROFILE: token-store
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_sqlite_token_store.py tests/test_token_store_operations.py -v

      - name: Exercise complete native corpus workflow
        if: matrix.profile == 'corpus'
        env:
          HF_HUB_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/test_corpus_*.py -v

  combined-acceptance:
    needs: changes
    if: |
      !cancelled() && (github.event_name != 'pull_request' ||
        (needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test --extra corpus --extra token-store
      - name: Exercise combined privacy and replay contracts
        env:
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: .venv/bin/python -m pytest tests/test_improvements_end_to_end.py -v

  quality-export:
    needs: changes
    if: |
      !cancelled() && (github.event_name != 'pull_request' ||
        (needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test --extra torch --extra quantize
      - name: Prepare pinned trained quality artifacts
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from huggingface_hub import snapshot_download
          models = {
              "quality_head": ("epfml/FineWeb2-HQ-Plus-Classifier", "bf13b1ac9448e874d0eb545891a58524d3f9afd1"),
              "quality_backbone": ("FacebookAI/xlm-roberta-base", "e73636d4f797dec63c3081bb6ed5c7b0bb3f2089"),
          }
          artifacts = {}
          for key, (repo, revision) in models.items():
              snapshot = Path(snapshot_download(repo, revision=revision,
                  allow_patterns=["*.json", "*.safetensors", "model.pt", "sentencepiece.bpe.model"]))
              files = {}
              for path in snapshot.rglob("*"):
                  if path.is_file():
                      with path.open("rb") as stream:
                          files[str(path.relative_to(snapshot))] = hashlib.file_digest(stream, "sha256").hexdigest()
              artifacts[key] = {"repo": repo, "revision": revision, "snapshot": str(snapshot), "files": files}
          Path("quality-artifacts.json").write_text(json.dumps(artifacts))
          PY
      - name: Exercise trained offline export and Torch ONNX parity
        env:
          SCT_QUALITY_EXPORT_ARTIFACTS: quality-artifacts.json
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: .venv/bin/python -m pytest tests/test_quality_export.py -v -s

  pinned-model-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.pinned_model_baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --locked --extra dev --extra test
      - run: .venv/bin/python -m pytest tests/test_batching.py tests/test_processing_compatibility.py -v
      - run: PYTHONPATH=. .venv/bin/python evaluation/improvements/measure_baseline.py
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-model-baseline
          path: baseline-measured.json

  required:
    name: Optional backend gate
    if: always() && github.event_name == 'pull_request'
    permissions:
      actions: read
    needs: [changes, backend, chunking-providers, provider-profile, combined-acceptance, quality-export]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required optional jobs
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          BACKEND: ${{ needs.backend.result }}
          CHUNKING: ${{ needs.chunking-providers.result }}
          PROFILES: ${{ needs.provider-profile.result }}
          ACCEPTANCE: ${{ needs.combined-acceptance.result }}
          EXPORT: ${{ needs.quality-export.result }}
        run: |
          test "$CHANGES" = success
          case "$DOCS_ONLY" in
            true) expected=skipped ;;
            false) expected=success ;;
            *) exit 1 ;;
          esac
          for result in "$BACKEND" "$CHUNKING" "$PROFILES" "$ACCEPTANCE" "$EXPORT"; do
            test "$result" = "$expected"
          done

      - name: Verify individual matrix results
        if: needs.changes.outputs.docs-only == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A matrix can report success in needs when an individual job was cancelled.
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
            jq -e '
              .total_count > 0 and .total_count == (.jobs | length) and
              all(.jobs[] | select(.name != "Optional backend gate" and .name != "pinned-model-baseline");
                  .status == "completed" and .conclusion == "success")
            '
