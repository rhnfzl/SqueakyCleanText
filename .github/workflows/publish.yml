name: Publish Python Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Find passing tests for this source tree
      id: evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        commit=$(git rev-parse HEAD)
        tree=$(git rev-parse 'HEAD^{tree}')
        python3 scripts/release_test_evidence.py "$commit" "$tree"

    - uses: actions/setup-python@v5
      if: steps.evidence.outputs.verified != 'true'
      with:
        python-version: '3.12'

    - name: Install fallback test dependencies
      if: steps.evidence.outputs.verified != 'true'
      run: pip install -e ".[dev,test]" --no-cache-dir

    - name: Lint with Ruff
      if: steps.evidence.outputs.verified != 'true'
      run: ruff check sct/ tests/

    - name: Run the full fallback test suite
      if: steps.evidence.outputs.verified != 'true'
      run: pytest tests/ -v

  build:
    needs: verify
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build the package
      run: python -m build

    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.9"
        enable-cache: false

    - name: Smoke-test the built wheel outside the checkout
      run: |
        uv sync --locked --no-install-project
        uv pip install --no-deps dist/*.whl
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/.venv/bin/python" -I -c 'from importlib.metadata import version; import sct; assert sct.__version__ == version("SqueakyCleanText")'
        "$GITHUB_WORKSPACE/.venv/bin/sct-clean" --help

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SqueakyCleanText
    permissions:
      id-token: write

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI with provenance
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Every tag gets a GitHub Release page, so PyPI and GitHub never drift.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Create GitHub Release from CHANGELOG
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        awk -v v="$version" '
          $0 ~ "^## \\[?" v "[] ]" || $0 == "## " v || $0 == "## [" v "]" {f=1; next}
          /^##+ / {if (f) exit}
          f' CHANGELOG.md > notes.md
        # Release page = the short summary at the top of the version's CHANGELOG section
        # (the text before its first ### heading), plus a link to the full changelog.
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::CHANGELOG.md $version needs a short summary before its first ### heading"
          exit 1
        fi
        printf '\nFull details: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --verify-tag --latest \
            --title "SqueakyCleanText $version" --notes-file notes.md
        fi
