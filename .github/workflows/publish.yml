name: Publish Python Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check initial disk usage
      run: df -h

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test]" --no-cache-dir

    - name: Clean up pip cache
      run: pip cache purge

    - name: Check disk usage after install
      run: df -h

    - name: Lint with ruff
      run: |
        ruff check sct/ tests/

    - name: Test with pytest
      run: |
        pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build the package
      run: python -m build

    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/SqueakyCleanText
    permissions:
      id-token: write

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI with provenance
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Every tag gets a GitHub Release page, so PyPI and GitHub never drift.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download package artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Create GitHub Release from CHANGELOG
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        version="${TAG#v}"
        awk -v v="$version" '
          $0 ~ "^## \\[?" v "[] ]" || $0 == "## " v || $0 == "## [" v "]" {f=1; next}
          /^##+ / {if (f) exit}
          f' CHANGELOG.md > notes.md
        # Release page = the short summary at the top of the version's CHANGELOG section
        # (the text before its first ### heading), plus a link to the full changelog.
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::CHANGELOG.md $version needs a short summary before its first ### heading"
          exit 1
        fi
        printf '\nFull details: https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --verify-tag --latest \
            --title "SqueakyCleanText $version" --notes-file notes.md
        fi
