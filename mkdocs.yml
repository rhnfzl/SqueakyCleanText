site_name: SqueakyCleanText
site_description: Text cleaning and PII anonymization for NLP and ML, in 75 languages.
site_url: https://rhnfzl.github.io/SqueakyCleanText/
repo_url: https://github.com/rhnfzl/SqueakyCleanText
repo_name: rhnfzl/SqueakyCleanText
edit_uri: edit/main/docs/
copyright: MIT License

# docs/ stays the GitHub-readable source; README, CHANGELOG and benchmarks/README
# are pulled in with pymdownx.snippets (base_path: repo root), never copied.
docs_dir: docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Get started:
      - Install: INSTALL.md
      - Quickstart: quickstart.md
  - Guides:
      - Configuration: CONFIG.md
      - NER backends: NER_BACKENDS.md
      - Replacement modes: REPLACEMENT_MODES.md
      - Privacy: PRIVACY.md
      - Adapters: ADAPTERS.md
      - Integrations: INTEGRATIONS.md
      - Recipes: RECIPES.md
      - MCP server: MCP.md
      - Languages: LANGUAGES.md
      - Adding languages: ADDING_LANGUAGES.md
  - Evaluation:
      - Evaluation: EVALUATION.md
      - Score columns: SCORE.md
      - Multilingual eval: MULTILINGUAL_EVAL.md
      - Performance: PERFORMANCE.md
      - Benchmarks: benchmarks.md
  - Reference:
      - API overview: API.md
      - TextCleaner: reference/text_cleaner.md
      - TextCleanerConfig: reference/config.md
      - ProcessResult: reference/process_result.md
      - preset_config: reference/presets.md
      - evaluate_pii: reference/evaluation.md
      - Integrations: reference/integrations.md
      - Score: reference/score.md
      - Changelog: changelog.md
