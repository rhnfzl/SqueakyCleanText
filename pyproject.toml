[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "SqueakyCleanText"
dynamic = ["version"]
description = "Text preprocessing & PII anonymization pipeline for NLP/ML: ONNX NER ensemble, language detection, stopword removal, and configurable token replacement."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rehan Fazal"}]
requires-python = ">=3.11"
keywords = [
    "text cleaning", "text preprocessing", "NLP", "natural language processing",
    "named entity recognition", "NER", "anonymization", "PII removal",
    "data cleaning", "machine learning", "ONNX", "language detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "lingua-language-detector>=2.1.0",
    "stop-words>=2025.11.4",
    "emoji>=2.14",
    "ftfy>=6.3",
    "Unidecode>=1.4",
    "beautifulsoup4>=4.14",
    "onnxruntime>=1.24.2",
    "tokenizers>=0.22.2",
    "huggingface-hub>=1.5.0",
    "numpy>=2.2.0",
    "presidio_anonymizer>=2.2.360",
    "regex>=2024.11.6",
]

[project.urls]
Homepage = "https://github.com/rhnfzl/SqueakyCleanText"
Repository = "https://github.com/rhnfzl/SqueakyCleanText"
Issues = "https://github.com/rhnfzl/SqueakyCleanText/issues"
Changelog = "https://github.com/rhnfzl/SqueakyCleanText/releases"
"llms.txt" = "https://github.com/rhnfzl/SqueakyCleanText/blob/main/llms.txt"

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.24.2",
]
fuzzy = [
    "rapidfuzz>=3.12",
]
torch = [
    "torch>=2.6.0",
    "transformers>=4.48",
]
gliner = [
    "gliner>=0.2.25,<1.0",
]
gliner2 = [
    "gliner2>=1.0,<2.0",
]
synthetic = [
    "faker>=33.0",
]
presidio = [
    "presidio-analyzer>=2.2.360",
]
classify = [
    "gliclass>=0.1.16",
]
classify-onnx = [
    "onnxruntime>=1.24.2",
]
all-ner = [
    "torch>=2.6.0",
    "transformers>=4.48",
    "gliner>=0.2.25,<1.0",
    "gliner2>=1.0,<2.0",
]
dev = [
    "hypothesis>=6.130",
    "faker>=33.0",
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "rapidfuzz>=3.12",
]
test = [
    "coverage>=7.8",
    "pytest-cov>=6.0",
]

[tool.setuptools.dynamic]
version = {attr = "sct.__version__"}

[tool.setuptools.packages.find]
include = ["sct*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
timeout = 1200

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = ["S101"]
