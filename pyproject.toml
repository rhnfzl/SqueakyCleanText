[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "SqueakyCleanText"
version = "0.4.1"
description = "A comprehensive text cleaning and preprocessing pipeline."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rehan Fazal"}]
requires-python = ">=3.10"
keywords = ["text cleaning", "text preprocessing", "NLP", "natural language processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
]
dependencies = [
    "lingua-language-detector>=2.0.2",
    "stop-words>=2018.7.23",
    "emoji>=2.8",
    "ftfy>=6.1",
    "Unidecode>=1.3",
    "beautifulsoup4>=4.12",
    "transformers>=4.30",
    "torch>=2.0.0",
    "presidio_anonymizer>=2.2.355",
]

[project.urls]
Homepage = "https://github.com/rhnfzl/SqueakyCleanText"

[project.optional-dependencies]
fuzzy = [
    "rapidfuzz>=3.0",
]
dev = [
    "hypothesis>=6.82",
    "faker>=20.0",
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "rapidfuzz>=3.0",
]
test = [
    "coverage>=7.3",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
include = ["sct*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
timeout = 1200

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = ["S101"]
