<polyline points="240,218.0 280,218.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="680,218.0 720,218.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="480,450 480,416" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="130" y="52" font-size="19" text-anchor="middle" font-weight="bold" fill="#495057" xml:space="preserve">In</text>
<text x="44" y="96" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Raw text</text>
<text x="44" y="118" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">a string or a list</text>
<text x="44" y="164" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">JSONL, JSON</text>
<text x="44" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">records, nested fields</text>
<text x="44" y="232" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Hugging Face dataset</text>
<text x="44" y="254" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">a text column</text>
<text x="44" y="300" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">DataTrove job</text>
<text x="44" y="322" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">a pipeline step</text>
<text x="44" y="368" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">RAG documents</text>
<text x="44" y="390" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">chunks before indexing</text>
<text x="480" y="52" font-size="19" text-anchor="middle" font-weight="bold" fill="#1864ab" xml:space="preserve">SqueakyCleanText</text>
<text x="306" y="96" font-size="17" text-anchor="start" font-weight="bold" fill="#1864ab" xml:space="preserve">Repair</text>
<text x="306" y="118" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">mojibake, HTML, Unicode, whitespace</text>
<text x="306" y="164" font-size="17" text-anchor="start" font-weight="bold" fill="#0b7285" xml:space="preserve">Detect language</text>
<text x="306" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">75 languages, with a confidence score</text>
<text x="306" y="232" font-size="17" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">Remove personal data</text>
<text x="306" y="254" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">regex rules + multilingual NER models</text>
<text x="306" y="300" font-size="17" text-anchor="start" font-weight="bold" fill="#a65b00" xml:space="preserve">Score and document</text>
<text x="306" y="322" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">value-free signals, sct_* columns</text>
<text x="306" y="368" font-size="17" text-anchor="start" font-weight="bold" fill="#2b8a3e" xml:space="preserve">Scale</text>
<text x="306" y="390" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">batched NER on CPU or GPU</text>
<text x="850" y="52" font-size="19" text-anchor="middle" font-weight="bold" fill="#343a40" xml:space="preserve">Out</text>
<text x="744" y="96" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Clean text</text>
<text x="744" y="118" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">lm_text, stat_text</text>
<text x="744" y="164" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">sct_* columns, signals</text>
<text x="744" y="186" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">language, PII, warnings</text>
<text x="744" y="232" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Quality score, MinHash</text>
<text x="744" y="254" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">optional, for filtering</text>
<text x="744" y="300" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Data card</text>
<text x="744" y="322" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">sct-report: JSON + Markdown</text>
<text x="744" y="368" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Reversible map</text>
<text x="744" y="390" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">optional, store it apart</text>
<text x="36" y="478" font-size="17" text-anchor="start" font-weight="bold" fill="#495057" xml:space="preserve">Run it from</text>
<text x="146.0" y="517.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">process / process_batch</text>
<text x="382.0" y="517.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">sct-clean (CLI)</text>
<text x="618.0" y="517.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">sct-report (CLI)</text>
<text x="854.0" y="517.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">sct-mcp (MCP)</text>
<text x="146.0" y="563.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Hugging Face datasets</text>
<text x="382.0" y="563.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">DataTrove</text>
<text x="618.0" y="563.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">LangChain</text>
<text x="854.0" y="563.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Haystack</text>
</svg>
