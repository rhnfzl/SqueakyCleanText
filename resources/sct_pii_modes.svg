<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="636" viewBox="0 0 1000 636" font-family="Helvetica, Arial, sans-serif">
<title>One sentence, three PII modes</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs>
<rect width="1000" height="636" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="92" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<rect x="80" y="150" width="900" height="108" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<rect x="80" y="274" width="900" height="218" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<rect x="96" y="376" width="520" height="100" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="80" y="508" width="900" height="108" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<polyline points="48,188 80,188" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="48,312 80,312" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="48,546 80,546" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="48,112 48,546" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="36" y="48" font-size="18" text-anchor="start" font-weight="bold" fill="#495057" xml:space="preserve">Input</text>
<text x="36" y="86" font-size="17" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Maria Chen lives in Utrecht. Mail her at maria.chen@example.com.</text>
<text x="60" y="137" font-size="15" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9" xml:space="preserve">replacement_mode=</text>
<text x="96" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">placeholder (default)</text>
<text x="96" y="204" font-size="15" text-anchor="start" font-weight="normal" fill="#343a40" xml:space="preserve">for training and RAG data</text>
<text x="96" y="238" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;PERSON&gt; lives in &lt;LOCATION&gt;. Mail her at &lt;EMAIL&gt;.</text>
<text x="96" y="304" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">reversible</text>
<text x="96" y="328" font-size="15" text-anchor="start" font-weight="normal" fill="#343a40" xml:space="preserve">to send text to an LLM and restore the answer</text>
<text x="96" y="362" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;PERSON_0&gt; lives in &lt;LOCATION_0&gt;. Mail her at &lt;EMAIL_0&gt;.</text>
<text x="110" y="402" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;PERSON_0&gt;   -&gt; Maria Chen</text>
<text x="110" y="428" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;LOCATION_0&gt; -&gt; Utrecht</text>
<text x="110" y="454" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;EMAIL_0&gt;    -&gt; maria.chen@example.com</text>
<text x="632" y="402" font-size="15" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#6741d9" xml:space="preserve">map.deanonymize(answer)</text>
<text x="632" y="428" font-size="15" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">restores the values; the map</text>
<text x="632" y="454" font-size="15" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">is personal data, store it apart.</text>
<text x="96" y="538" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">synthetic</text>
<text x="96" y="562" font-size="15" text-anchor="start" font-weight="normal" fill="#343a40" xml:space="preserve">fake values, the same fakes for the same document; needs the synthetic extra</text>
<text x="96" y="596" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Patty Hunter lives in East Bobbyfurt. Mail her at lindabradley@example.net.</text>
</svg>
