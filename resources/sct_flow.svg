<polyline points="790,456 790,468 130,468 130,492" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="350,628.0 380,628.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="650,628.0 680,628.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="34" y="50" font-size="18" text-anchor="start" font-weight="bold" fill="#495057" xml:space="preserve">Entry points: all of them run the same pipeline</text>
<text x="34" y="80" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">process(), process_batch(), sct-clean, sct-mcp, Hugging Face datasets, DataTrove, LangChain,</text>
<text x="34" y="103" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Haystack, JSON, DataFrame and RAG adapters, streaming redactors</text>
<text x="34" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#0b7285" xml:space="preserve">1  Detect language</text>
<text x="34" y="210" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Lingua, 75 languages</text>
<text x="34" y="233" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">reads the raw input</text>
<text x="34" y="256" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">pin it or limit it:</text>
<text x="34" y="279" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">  language=</text>
<text x="34" y="302" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">low confidence:</text>
<text x="34" y="325" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">  a warning</text>
<text x="34" y="348" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">picks the NER models</text>
<text x="34" y="371" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">and the Faker locale</text>
<text x="284" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#1864ab" xml:space="preserve">2  Fix the text</text>
<text x="420.0" y="216.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Unicode repair (ftfy)</text>
<text x="420.0" y="254.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">fold styled characters</text>
<text x="420.0" y="292.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">ASCII transliteration  (off)</text>
<text x="420.0" y="330.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">emoji removal  (off)</text>
<text x="420.0" y="368.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">HTML entities and tags</text>
<text x="614" y="180" font-size="18" text-anchor="start" font-weight="bold" fill="#a65b00" xml:space="preserve">3  Regex PII and cleanup</text>
<text x="699.0" y="216.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">URLs</text>
<text x="699.0" y="252.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">emails</text>
<text x="699.0" y="288.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">IPs</text>
<text x="699.0" y="324.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">dates</text>
<text x="699.0" y="360.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">fuzzy dates  (off)</text>
<text x="699.0" y="396.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">IBAN, cards</text>
<text x="881.0" y="216.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">ID codes  (off)</text>
<text x="881.0" y="252.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">phones</text>
<text x="881.0" y="288.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">years</text>
<text x="881.0" y="324.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">numbers</text>
<text x="881.0" y="360.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">currency symbols</text>
<text x="881.0" y="396.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">symbols, spaces</text>
<text x="790" y="446" font-size="15" text-anchor="middle" font-weight="normal" fill="#a65b00" xml:space="preserve">run in column order; counted in regex_counts</text>
<text x="34" y="522" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">4  NER</text>
<text x="185.0" y="558.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">ONNX models per language</text>
<text x="185.0" y="594.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">vote: best model score</text>
<text x="185.0" y="630.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">long text: chunk windows</text>
<text x="185.0" y="666.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">propagate masked names</text>
<text x="185.0" y="702.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">snap to word edges</text>
<text x="185.0" y="738.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">GLiNER, ner_mode=&quot;pii&quot;  (off)</text>
<text x="394" y="522" font-size="18" text-anchor="start" font-weight="bold" fill="#2b8a3e" xml:space="preserve">5  Replace</text>
<text x="515.0" y="558.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;PERSON&gt; tags</text>
<text x="515.0" y="596.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">synthetic fakes  (off)</text>
<text x="515.0" y="634.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">reversible &lt;PERSON_0&gt;  (off)</text>
<text x="394" y="680" font-size="15" text-anchor="start" font-weight="normal" fill="#2b8a3e" xml:space="preserve">reversible keeps a map</text>
<text x="394" y="702" font-size="15" text-anchor="start" font-weight="normal" fill="#2b8a3e" xml:space="preserve">(or a TokenStore reference);</text>
<text x="394" y="724" font-size="15" text-anchor="start" font-weight="normal" fill="#2b8a3e" xml:space="preserve">the map holds personal data</text>
<text x="694" y="522" font-size="18" text-anchor="start" font-weight="bold" fill="#343a40" xml:space="preserve">6  Output</text>
<text x="694" y="552" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">lm_text: the cleaned text</text>
<text x="694" y="575" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">stat_text: lower case, no</text>
<text x="694" y="598" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">  stopwords or punctuation</text>
<text x="694" y="621" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">language</text>
<text x="694" y="644" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">signals: counts, warnings,</text>
<text x="694" y="667" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">  no raw values</text>
<text x="694" y="690" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">metadata: + regex_counts</text>
<text x="36" y="816" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">process_batch: threads per document, NER batched across documents (ner_batch_size)</text>
<text x="36" y="842" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">NER on CPU or CUDA (ner_device). Preset &quot;training&quot;: PII only, keeps numbers, dates, HTML.</text>
<text x="120.0" y="892.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">on by default</text>
<text x="336.0" y="892.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">off by default</text>
<text x="452" y="892" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">(off): opt in with its config field</text>
</svg>
