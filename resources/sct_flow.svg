<rect x="796" y="376" width="170" height="30" rx="8" fill="#ffffff" stroke="#a65b00" stroke-width="2"/>
<rect x="20" y="492" width="330" height="272" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="538" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="574" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="610" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="646" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="682" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="718" width="302" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2" stroke-dasharray="6 4"/>
