<polyline points="790,368 790,398 160,398 160,428" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="320,562.0 350,562.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="660,562.0 690,562.0" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="36" y="52" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Any entry point (process(), process_batch(), sct-clean, sct-mcp, the adapters) runs this pipeline</text>
<text x="34" y="130" font-size="18" text-anchor="start" font-weight="bold" fill="#0b7285" xml:space="preserve">1  Detect language</text>
<text x="34" y="160" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Lingua, 75 languages</text>
<text x="34" y="196" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">on the raw input</text>
<text x="34" y="232" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">language= pins or limits</text>
<text x="34" y="268" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">low confidence warns</text>
<text x="34" y="304" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">picks the NER models</text>
<text x="34" y="340" font-size="16" text-anchor="start" font-weight="normal" fill="#1e1e1e" xml:space="preserve">and the Faker locale</text>
<text x="314" y="130" font-size="18" text-anchor="start" font-weight="bold" fill="#1864ab" xml:space="preserve">2  Fix the text</text>
<text x="435.0" y="166.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">Unicode repair (ftfy)</text>
<text x="435.0" y="204.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">fold styled characters</text>
<text x="435.0" y="242.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">ASCII transliteration  (off)</text>
<text x="435.0" y="280.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">emoji removal  (off)</text>
<text x="435.0" y="318.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">HTML entities and tags</text>
<text x="614" y="130" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">3  Regex PII and cleanup</text>
<text x="699.0" y="166.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">URLs</text>
<text x="699.0" y="202.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">emails</text>
<text x="699.0" y="238.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">IPs</text>
<text x="699.0" y="274.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">dates</text>
<text x="699.0" y="310.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">fuzzy dates  (off)</text>
<text x="699.0" y="346.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">IBAN, cards</text>
<text x="881.0" y="166.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">ID codes  (off)</text>
<text x="881.0" y="202.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">phones</text>
<text x="881.0" y="238.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">years</text>
<text x="881.0" y="274.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">numbers</text>
<text x="881.0" y="310.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">currency symbols</text>
<text x="881.0" y="346.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">symbols, spaces</text>
<text x="34" y="458" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">4  NER</text>
<text x="170.0" y="494.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">ONNX models per language</text>
<text x="170.0" y="530.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">vote: best model score</text>
<text x="170.0" y="566.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">long text: chunk windows</text>
<text x="170.0" y="602.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">propagate masked names</text>
<text x="170.0" y="638.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">snap to word edges</text>
<text x="170.0" y="674.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">GLiNER, ner_mode=&quot;pii&quot;  (off)</text>
<text x="364" y="458" font-size="18" text-anchor="start" font-weight="bold" fill="#6741d9" xml:space="preserve">5  Replacement mode</text>
<text x="505.0" y="494.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">&lt;PERSON&gt; tags</text>
<text x="505.0" y="532.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">synthetic fakes  (off)</text>
<text x="505.0" y="570.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">reversible &lt;PERSON_0&gt;  (off)</text>
<text x="364" y="608" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">Placeholder tags are written in</text>
<text x="364" y="630" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">steps 3 and 4. Synthetic and</text>
<text x="364" y="652" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">reversible swap the values in</text>
<text x="364" y="674" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">after NER.</text>
<text x="704" y="458" font-size="18" text-anchor="start" font-weight="bold" fill="#2b8a3e" xml:space="preserve">6  Output</text>
<text x="704" y="488" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">lm_text</text>
<text x="704" y="508" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">the cleaned text</text>
<text x="704" y="530" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">stat_text</text>
<text x="704" y="550" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">lower case, no stopwords</text>
<text x="704" y="572" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">language</text>
<text x="704" y="592" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">the detected language</text>
<text x="704" y="614" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">signals</text>
<text x="704" y="634" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">counts, warnings, no values</text>
<text x="704" y="656" font-size="16" text-anchor="start" font-family="Menlo, Consolas, monospace" font-weight="normal" fill="#1e1e1e" xml:space="preserve">metadata</text>
<text x="704" y="676" font-size="15" text-anchor="start" font-weight="normal" fill="#495057" xml:space="preserve">adds regex_counts</text>
<text x="120.0" y="736.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1e1e1e" xml:space="preserve">on by default</text>
<text x="336.0" y="736.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#495057" xml:space="preserve">off by default</text>
</svg>
