<rect x="796" y="218" width="170" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="796" y="254" width="170" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="796" y="290" width="170" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="796" y="326" width="170" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="20" y="428" width="300" height="268" rx="8" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="474" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="510" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="546" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="582" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="618" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2"/>
<rect x="34" y="654" width="272" height="30" rx="8" fill="#ffffff" stroke="#6741d9" stroke-width="2" stroke-dasharray="6 4"/>
