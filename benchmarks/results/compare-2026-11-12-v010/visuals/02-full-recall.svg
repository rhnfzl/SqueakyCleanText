  <g id="text_8">
   <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #43566b" transform="translate(56.16 907.070625)">One block per configuration pair; matched documents.</text>
   <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #43566b" transform="translate(56.16 937.870625)">Direction uses unadjusted paired 95% intervals.</text>
   <text style="font-size: 22px; font-family: 'DejaVu Sans'; fill: #43566b" transform="translate(56.16 968.670625)">Any overlap counts; complete redaction is stricter.</text>
